<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ইনফিনিটি ভাইয়ের জাদুকরী ওয়েবসাইট</title>
    <style>
       
        input {
            padding: 12px;
            font-size: 16px;
            border-radius: 50px;
            border: 2px solid #ff4500;
            background-color: #ff0000;
            color: #ffffff;
            margin-bottom: 15px;
            width: 80%;
            max-width: 300px;
            outline: none;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #0000ff;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background-color: #ffff00;
        }
    </style>
</head>
<body style="background-color: #1a1a1a; color: #ffffff; font-family: sans-serif; text-align: center; padding: 40px 20px;">

    <h1>আসসালামু আলাইকুম ভাই! 👋</h1>
    <p style="color: #bbbbbb;">আমি টার্মাক্সে সফলভাবে কোড লিখেছি। 🥀</p>
    
    <p>
        <img src="https://picsum.photos/300/200" alt="ইন্টারনেট থেকে ছবি" style="border-radius: 12px; border: 2px solid #ffffff; box-shadow: 0px 4px 15px rgba(255, 255, 255, 0.1);">
    </p>

    <p>
        <input type="text" id="myInput" placeholder="এখানে তোমার নাম লেখো ভাই...">
    </p>

    <p>
        <button type="button" onclick="showMagic()">ম্যাজিক দেখো 🪄</button>
    </p>

    <script>
        function showMagic() {
            var name = document.getElementById("myInput").value.trim();
            
            if (name === "") {
                alert("আগে বক্সে কিছু একটা লেখো ভাই! 😃");
            } else {
                alert("স্বাগতম ভাই " + name + "! তুমি তো পুরো প্রো-ডেভেলপার হয়ে গেছ! 🔥");
            }
        }
    </script>

</body>
</html>
